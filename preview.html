<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Banner Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #09111c;
      color: #f8fafc;
      font-family: Inter, system-ui, sans-serif;
    }

    .preview {
      width: min(1280px, 100%);
      padding: 32px;
      box-sizing: border-box;
    }

    picture,
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 24px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35);
    }

    .notice {
      margin-top: 24px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cbd5e1;
    }

    @media (prefers-color-scheme: light) {
      body {
        background: #f3f7fb;
        color: #0f172a;
      }

      .notice {
        color: #475569;
      }
    }
  </style>
</head>
<body>
  <div class="preview">
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="dark.svg" />
      <source media="(prefers-color-scheme: light)" srcset="light.svg" />
      <img src="dark.svg" alt="Aditya Pujari premium DevOps profile banner" />
    </picture>
    <p class="notice">
      Use your browser's color-scheme preference to switch between the dark and light versions.
      The banner includes a fallback portrait placeholder when <code>assets/profile-biometric.png</code> is missing.
    </p>
  </div>
</body>
</html>
